name: Sync Fern version

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  sync:
    name: Sync package version
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'fern-bot/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Sync package metadata
        run: python scripts/sync_fern_version.py

      - name: Commit synced version
        id: commit
        run: |
          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "Sync Fern package version"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run CI on synced commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref "${{ github.event.pull_request.head.ref }}"
